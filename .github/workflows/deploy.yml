# Publica la app en GitHub Pages cada vez que se sube algo a la rama main.
# Usa los datos ya generados de public/data/ (el dump.sql NO está en GitHub).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # botón "Run workflow" para publicar a mano

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Revisar los datos (cifras de control)
        run: python3 -m unittest discover -s tests -v

      - name: Revisar que no se publique nada privado
        run: python3 scripts/audit_public.py

      - name: Revisar contraste de colores
        run: python3 scripts/check_contrast.py

      - name: Tests de la app
        run: npm test

      - name: Construir
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
